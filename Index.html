<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>X-clone</title>
</head>
<body>
    <!-- layout  -->
    <div class="layout">
        <aside class="sidebar">
           <a class="home" href="#home">Home</a>
           <nav aria-label="Main Navigation">
                <button data-view="home">Home</button>
                <button data-view="explore">Explore</button>
                <button data-view="themeToggle">Notifications</button>
            </nav>
        <button class="primary" id="openModel">Let's hear your thoughts!</button>
        </aside>

        <!-- main section -->
         <main>
            <header class="topbar"><h1 id="pageTitle"></h1></header>
                <section id="homeView">
                    <div class="tabs">
                        <div class="selected" data-feed="all">For you</div>
                            <button data-feed="following">Following</button>    
                    </div>

            <form id="postForm" class="composer">
                <label class="sr-only" for="draft"> Write a post</label>
                <textarea id="postInput"
                    placeholder="What's on your mind?" 
                    maxlength="280" 
                    required></textarea>
                  <div class="composer-foot">
                  <span id="counter">0/280</span>
                <button class="primary" id="postButton" disabled>Post</button>
                </div>
            </form>
                <div id="feed" aria-live="polite"> </div>
            </section>

            <!-- feed -->
             <section id="exploreView" hidden>
                <h2>What's Trending</h2>
                <p>Explore the latest posts from our community.</p>
                <div id="trends">
                    <article><small>latest Netflix movie</small><strong>#trending#movie</strong></article>
                    <article><small>popular YouTube video</small><strong>#trending#video</strong></article>
                    <article><small>new tech gadget</small><strong>#trending#tech</strong></article>
                </div>
             </section>
         </main>
    </div>
    <nav class="mobile-nav" aria-label="Mobile navigation">
            <button data-view="home">Home</button>
            <button data-view="explore">Explore</button>
            <button id="mobileCompose">+ Post</button>
    </nav>
        <div class="backdrop" id="backdrop" hidden>
            <section class="modal" role="dialog" aria-modal="true"
                aria-labelledby="modalTitle">
                    <button class="close" id="closeModal" aria-label="Close">×</button>
                    <h2 id="modalTitle">Write a post</h2>
                    <label class="sr-only" for="modalDraft">Your post</label>
                        <textarea id="modalDraft" maxlength="280"
                            placeholder="What's happening?"></textarea>
                            <div class="composer-foot">
<span id="modalCounter">0 / 280</span>
<button class="primary" id="modalPost" disabled>Post</button>
        </div>
            </section>
                        </div>
<script src="index.js"></script>
</body>
</html>
